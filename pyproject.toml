[tool.poetry]
name = "PythonProject35"
version = "0.1.0"
description = "Django DRF project with Celery, CORS, JWT, Stripe"
authors = ["You <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.0"
djangorestframework = "^3.14"
psycopg2-binary = "^2.9"
celery = "^5.4"
redis = "^5.0"
dj-rest-auth = "^4.0"
django-cors-headers = "^4.3"
djangorestframework_simplejwt = "^5.11"
stripe = "^7.0"
drf-spectacular = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.9"
pytest-cov = "^5.0"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"