version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --access-logfile - --error-logfile -
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # volumes: - .:/app  <-- УДАЛИТЬ: код уже внутри образа
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l info --pool=solo
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # volumes: - .:/app  <-- УДАЛИТЬ
    networks:
      - main-net

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # volumes: - .:/app  <-- УДАЛИТЬ
    networks:
      - main-net

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ports: - "5432:5432"  <-- УДАЛИТЬ: не открывать наружу
    networks:
      - main-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # ports: - "6379:6379"  <-- УДАЛИТЬ: не открывать наружу
    networks:
      - main-net

volumes:
  pgdata:
  redisdata:
  # media_volume:  <-- можно оставить, если нужно хранить медиа вне контейнера

networks:
  main-net:
    driver: bridge